[package]
name = "http-detection-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Bounded, parallel HTTP log threat detection with attributed findings"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ai-blueteam/http-detection-agent"
# The engine is MIT. Separately loaded rule data retains its upstream licenses.
# Registry publication is intentionally disabled.
publish = false

[lib]
name = "http_detection_agent"

[[bin]]
name = "http-detect"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simd-json = "0.17"
regex = "1"
rayon = "1"
memchr = "2"
flate2 = "1"
zstd = "0.13"
chrono = { version = "0.4", default-features = false, features = ["std"] }
percent-encoding = "2"
html-escape = "0.2"
sha2 = "0.10"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
